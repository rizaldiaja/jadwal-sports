<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Jadwal Olahraga Lengkap Saya</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2027">
<!-- iOS PWA Support -->
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jadwal Sport">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    color: #333; max-width: 1000px; margin: 0 auto; padding: 20px; min-height: 100vh;
  }
  h1 { color: white; text-align: center; margin-bottom: 5px; font-size: 1.9em; }
  .subtitle { color: #a0c4ff; text-align: center; margin-bottom: 20px; font-size: 0.9em; }
  #notification-bar { text-align: center; margin-bottom: 20px; padding: 12px; background: #fff3cd; border-radius: 10px; border: 1px solid #ffeaa7; }
  #enable-notifications { background: #ff6b6b; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 0.95em; transition: 0.2s; }
  #enable-notifications:hover { background: #ee5253; }
  #enable-notifications:disabled { background: #28a745; cursor: default; }

  .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
  .tab-btn { background: rgba(255,255,255,0.15); color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.85em; transition: 0.2s; }
  .tab-btn:hover { background: rgba(255,255,255,0.3); }
  .tab-btn.active { background: white; color: #0f2027; }

  .sport-section { background: white; border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
  .sport-section h2 { border-left: 5px solid #007bff; padding-left: 12px; margin-top: 0; color: #0f2027; font-size: 1.1em; }
  .match-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; gap: 10px; }
  .match-item:last-child { border-bottom: none; }
  .time { font-weight: bold; color: #007bff; min-width: 90px; font-size: 0.85em; }
  .teams { flex-grow: 1; font-size: 0.9em; }
  .reminder-btn { background: #007bff; color: white; border: none; padding: 7px 14px; border-radius: 20px; cursor: pointer; font-size: 0.8em; font-weight: 600; transition: 0.2s; white-space: nowrap; }
  .reminder-btn:hover { background: #0056b3; }
  .reminder-btn.active { background: #28a745; }

  .loading { text-align: center; color: #888; padding: 40px 20px; }
  .spinner {
    display: inline-block; width: 32px; height: 32px;
    border: 4px solid rgba(0,123,255,0.2); border-top-color: #007bff;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #dc3545; text-align: center; padding: 15px; }
  .retry-btn { background: #007bff; color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: 600; margin-top: 10px; }
  .retry-btn:hover { background: #0056b3; }
  .note { font-size: 0.8em; color: #666; font-style: italic; margin-top: 10px; }

  #active-reminders { background: rgba(255,255,255,0.95); border-radius: 14px; padding: 15px 20px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
  #active-reminders h3 { margin-top: 0; color: #0f2027; }
  #active-reminders ul { list-style: none; padding: 0; margin: 0; }
  #active-reminders li { padding: 8px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; }
  #active-reminders li:last-child { border: none; }
  .delete-reminder { background: #dc3545; color: white; border: none; padding: 4px 10px; border-radius: 12px; cursor: pointer; font-size: 0.75em; }
</style>
</head>
<body>

<h1>🏆 Jadwal Olahraga Lengkap</h1>
<p class="subtitle">NBA · Sepak Bola · F1 · UFC · MotoGP · ONE · Tenis · Kriket · dll.</p>

<div id="notification-bar">
  <button id="enable-notifications">🔔 Aktifkan Izin Notifikasi</button>
</div>

<div id="active-reminders">
  <h3>⏰ Pengingat Aktif Saya</h3>
  <ul id="reminder-list"><li style="color:#888;">Belum ada pengingat.</li></ul>
</div>

<div class="tabs" id="tabs-container">
  <!-- Tabs akan diisi JS -->
</div>

<div id="matches-container">
  <div class="loading"><div class="spinner"></div><br>Memuat data...</div>
</div>

<script>
/* =====================================================
   1. KONFIGURASI LIGA ESPN (Semua yang Didukung)
   ===================================================== */
const ESPN_LEAGUES = {
  // --- Basket ---
  nba:      { title: '🏀 NBA',                 url: 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard' },
  wnba:     { title: '🏀 WNBA',                url: 'https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/scoreboard' },
  ncaam:    { title: '🏀 NCAA Basket Putra',   url: 'https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard' },
  // --- Sepak Bola (Utama) ---
  epl:      { title: '⚽ Liga Premier',        url: 'https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard' },
  laliga:   { title: '⚽ La Liga',             url: 'https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard' },
  bundesliga:{title: '⚽ Bundesliga',          url: 'https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/scoreboard' },
  seriea:   { title: '⚽ Serie A',             url: 'https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard' },
  ligue1:   { title: '⚽ Ligue 1',             url: 'https://site.api.espn.com/apis/site/v2/sports/soccer/fra.1/scoreboard' },
  ucl:      { title: '⚽ Liga Champions',      url: 'https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard' },
  mls:      { title: '⚽ MLS',                 url: 'https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard' },
  // --- Balap ---
  f1:       { title: '🏎️ Formula 1',          url: 'https://site.api.espn.com/apis/site/v2/sports/racing/f1/scoreboard' },
  indycar:  { title: '🏎️ IndyCar',            url: 'https://site.api.espn.com/apis/site/v2/sports/racing/indycar/scoreboard' },
  nascar:   { title: '🏎️ NASCAR',             url: 'https://site.api.espn.com/apis/site/v2/sports/racing/nascar-premier/scoreboard' },
  // --- Sepak Bola Amerika ---
  nfl:      { title: '🏈 NFL',                 url: 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard' },
  // --- Hoki ---
  nhl:      { title: '🏒 NHL',                 url: 'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard' },
  // --- Bisbol ---
  mlb:      { title: '⚾ MLB',                 url: 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard' },
  // --- Tenis ---
  atp:      { title: '🎾 ATP',                 url: 'https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard' },
  wta:      { title: '🎾 WTA',                 url: 'https://site.api.espn.com/apis/site/v2/sports/tennis/wta/scoreboard' },
  // --- MMA (ESPN hanya punya UFC, datanya terbatas) ---
  ufc:      { title: '🥊 UFC',                 url: 'https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard' },
  // --- Kriket ---
  ipl:      { title: '🏏 IPL',                 url: 'https://site.api.espn.com/apis/site/v2/sports/cricket/8039/scoreboard' },
};

/* =====================================================
   2. DATA HARDCODE (MotoGP & ONE, Karena Tidak Ada API)
   ===================================================== */
const HARDCODED_EVENTS = {
  motogp: {
    title: '🏍️ MotoGP 2026',
    events: [
      { name: 'GP Thailand (Buriram)', date: '2026-03-01T08:00:00Z' },
      { name: 'GP Brasil (Goiânia)', date: '2026-03-22T08:00:00Z' },
      { name: 'GP Americas (COTA)', date: '2026-03-29T08:00:00Z' },
      { name: 'GP Spanyol (Jerez)', date: '2026-04-26T08:00:00Z' },
      { name: 'GP Prancis (Le Mans)', date: '2026-05-10T08:00:00Z' },
      { name: 'GP Catalunya', date: '2026-05-17T08:00:00Z' },
      { name: 'GP Italia (Mugello)', date: '2026-05-31T08:00:00Z' },
      { name: 'GP Belanda (Assen)', date: '2026-06-28T08:00:00Z' },
      { name: 'GP Jerman (Sachsenring)', date: '2026-07-12T08:00:00Z' },
      { name: 'GP Inggris (Silverstone)', date: '2026-08-09T08:00:00Z' },
      { name: 'GP Aragon', date: '2026-08-30T08:00:00Z' },
      { name: 'GP San Marino (Misano)', date: '2026-09-13T08:00:00Z' },
      { name: 'GP Austria (Red Bull Ring)', date: '2026-09-20T08:00:00Z' },
      { name: 'GP Jepang (Motegi)', date: '2026-10-04T08:00:00Z' },
      { name: 'GP Indonesia (Mandalika)', date: '2026-10-11T08:00:00Z' },
      { name: 'GP Australia (Phillip Island)', date: '2026-10-25T08:00:00Z' },
      { name: 'GP Malaysia (Sepang)', date: '2026-11-01T08:00:00Z' },
      { name: 'GP Qatar (Lusail)', date: '2026-11-08T08:00:00Z' },
      { name: 'GP Portugal (Portimão)', date: '2026-11-22T08:00:00Z' },
      { name: 'GP Valencia', date: '2026-11-29T08:00:00Z' },
    ]
  },
  onefc: {
    title: '🥊 ONE Championship 2026',
    events: [
      { name: 'ONE Fight Night 39', date: '2026-01-23T12:00:00Z' },
      { name: 'ONE Fight Night 40', date: '2026-02-13T12:00:00Z' },
      { name: 'ONE Fight Night 41', date: '2026-03-13T12:00:00Z' },
      { name: 'ONE 174', date: '2026-04-03T12:00:00Z' },
      { name: 'ONE Fight Night 42', date: '2026-04-10T12:00:00Z' },
      { name: 'ONE 175 (Tokyo)', date: '2026-04-29T12:00:00Z' },
      { name: 'ONE Fight Night 43', date: '2026-05-15T12:00:00Z' },
      { name: 'ONE: Denver', date: '2026-06-26T12:00:00Z' },
      { name: 'ONE Fight Night 44', date: '2026-07-10T12:00:00Z' },
      { name: 'ONE Fight Night 45', date: '2026-08-07T12:00:00Z' },
      { name: 'ONE Fight Night 46', date: '2026-09-04T12:00:00Z' },
      { name: 'ONE Fight Night 47', date: '2026-10-02T12:00:00Z' },
      { name: 'ONE Fight Night 48', date: '2026-11-06T12:00:00Z' },
      { name: 'ONE Fight Night 49', date: '2026-12-11T12:00:00Z' },
    ]
  }
};

/* =====================================================
   3. STATE GLOBAL
   ===================================================== */
let currentKey = 'nba';
let reminders = JSON.parse(localStorage.getItem('my-reminders')) || [];
const matchesContainer = document.getElementById('matches-container');
const tabsContainer = document.getElementById('tabs-container');
const enableBtn = document.getElementById('enable-notifications');

// Cache untuk liga sepak bola (mengurangi beban API)
const soccerCache = {};

/* =====================================================
   4. NOTIFIKASI
   ===================================================== */
function updateNotificationButton() {
  if (!('Notification' in window)) { enableBtn.textContent = '❌ Browser tidak mendukung'; enableBtn.disabled = true; return; }
  if (Notification.permission === 'granted') { enableBtn.textContent = '✅ Notifikasi Aktif'; enableBtn.disabled = true; }
  else if (Notification.permission === 'denied') { enableBtn.textContent = '🚫 Diblokir (buka Setelan Browser)'; enableBtn.disabled = true; }
}
enableBtn.addEventListener('click', async () => {
  if (!('Notification' in window)) { alert('Browser tidak mendukung notifikasi.'); return; }
  const permission = await Notification.requestPermission();
  updateNotificationButton();
  if (permission === 'granted') new Notification('🎉 Notifikasi Aktif!', { body: 'Anda akan menerima pengingat pertandingan.', icon: 'https://a.espncdn.com/favicon.ico' });
});
updateNotificationButton();

/* =====================================================
   5. RENDER TAB
   ===================================================== */
function renderTabs() {
  const allKeys = [...Object.keys(ESPN_LEAGUES), ...Object.keys(HARDCODED_EVENTS)];
  tabsContainer.innerHTML = allKeys.map(key => {
    let title = '';
    if (ESPN_LEAGUES[key]) title = ESPN_LEAGUES[key].title;
    else if (HARDCODED_EVENTS[key]) title = HARDCODED_EVENTS[key].title;
    const active = key === currentKey ? ' active' : '';
    return `<button class="tab-btn${active}" data-key="${key}">${title}</button>`;
  }).join('');

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentKey = btn.dataset.key;
      loadContent(currentKey);
    });
  });
}

/* =====================================================
   6. FUNGSI PEMUATAN KONTEN
   ===================================================== */
async function loadContent(key) {
  matchesContainer.innerHTML = `<div class="loading"><div class="spinner"></div><br>Memuat data...</div>`;

  // Hardcode?
  if (HARDCODED_EVENTS[key]) {
    renderHardcoded(key);
    return;
  }

  // ESPN?
  const league = ESPN_LEAGUES[key];
  if (!league) return;

  const isSoccer = league.url.includes('/soccer/');

  try {
    let allEvents = [];

    if (isSoccer) {
      // Cek cache (5 menit)
      if (soccerCache[key] && Date.now() - soccerCache[key].time < 5 * 60 * 1000) {
        allEvents = soccerCache[key].data;
      } else {
        // Ambil data untuk 7 hari ke depan
        const today = new Date();
        const promises = [];
        for (let i = 0; i < 7; i++) {
          const date = new Date(today);
          date.setDate(today.getDate() + i);
          const dateStr = date.toISOString().slice(0, 10).replace(/-/g, '');
          const urlWithDate = `${league.url}?dates=${dateStr}`;
          promises.push(fetch(urlWithDate).then(res => res.ok ? res.json() : null).catch(() => null));
        }
        const results = await Promise.all(promises);
        
        results.forEach(data => {
          if (data && data.events) allEvents = allEvents.concat(data.events);
        });

        // Deduplikasi
        const uniqueEvents = [];
        const seenIds = new Set();
        allEvents.forEach(event => {
          if (event.id && !seenIds.has(event.id)) {
            seenIds.add(event.id);
            uniqueEvents.push(event);
          } else if (!event.id && !uniqueEvents.some(e => e.name === event.name && e.date === event.date)) {
            uniqueEvents.push(event);
          }
        });
        allEvents = uniqueEvents;

        // Simpan ke cache
        soccerCache[key] = { data: allEvents, time: Date.now() };
      }

    } else {
      const res = await fetch(league.url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      allEvents = data.events || [];
    }

    if (allEvents.length === 0) {
      matchesContainer.innerHTML = `<div class="sport-section"><h2>${league.title}</h2><p style="color:#888;">Tidak ada pertandingan terjadwal dalam 7 hari ke depan.</p><p class="note">Catatan: Data diambil dari API ESPN.</p></div>`;
      return;
    }

    // Urutkan berdasarkan tanggal
    allEvents.sort((a, b) => new Date(a.date) - new Date(b.date));

    let html = `<div class="sport-section"><h2>${league.title}</h2>`;
    allEvents.forEach(event => {
      const name = event.name || event.shortName || 'Pertandingan';
      const dateStr = event.date;
      if (!dateStr) return;
      const dateObj = new Date(dateStr);
      const timeStr = dateObj.toLocaleString('id-ID', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
      const isActive = reminders.some(r => r.name === name && r.time === dateStr);
      const btnClass = isActive ? 'reminder-btn active' : 'reminder-btn';
      const btnText = isActive ? '✅ Diingatkan' : '🔔 Ingatkan';
      const safeName = name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      html += `<div class="match-item">
        <span class="time">${timeStr}</span>
        <span class="teams">${name}</span>
        <button class="${btnClass}" onclick="setReminder('${dateStr}', '${safeName}', this)">${btnText}</button>
      </div>`;
    });
    html += `</div>`;
    matchesContainer.innerHTML = html;

  } catch (err) {
    console.error(err);
    matchesContainer.innerHTML = `<div class="sport-section"><h2>${league.title}</h2><p class="error">❌ Gagal memuat. Periksa koneksi internet.</p><button class="retry-btn" onclick="loadContent('${key}')">🔄 Coba Lagi</button></div>`;
  }
}

function renderHardcoded(key) {
  const data = HARDCODED_EVENTS[key];
  const now = Date.now();
  const upcoming = data.events.filter(e => new Date(e.date).getTime() > now - 3600000).sort((a,b) => new Date(a.date) - new Date(b.date));

  if (upcoming.length === 0) {
    matchesContainer.innerHTML = `<div class="sport-section"><h2>${data.title}</h2><p style="color:#888;">Tidak ada acara mendatang di musim ini.</p><p class="note">Data ini di-hardcode karena tidak ada API publik.</p></div>`;
    return;
  }

  let html = `<div class="sport-section"><h2>${data.title}</h2><p class="note">Jadwal ini diperbarui secara manual (tidak melalui API).</p>`;
  upcoming.forEach(event => {
    const dateObj = new Date(event.date);
    const timeStr = dateObj.toLocaleString('id-ID', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    const isActive = reminders.some(r => r.name === event.name && r.time === event.date);
    const btnClass = isActive ? 'reminder-btn active' : 'reminder-btn';
    const btnText = isActive ? '✅ Diingatkan' : '🔔 Ingatkan';
    const safeName = event.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    html += `<div class="match-item">
      <span class="time">${timeStr}</span>
      <span class="teams">${event.name}</span>
      <button class="${btnClass}" onclick="setReminder('${event.date}', '${safeName}', this)">${btnText}</button>
    </div>`;
  });
  html += `</div>`;
  matchesContainer.innerHTML = html;
}

/* =====================================================
   7. PENGINGAT
   ===================================================== */
function setReminder(isoTime, matchName, btnEl) {
  // Cegah pengingat untuk acara yang sudah lewat
  if (new Date(isoTime).getTime() < Date.now()) {
    alert('Acara ini sudah dimulai atau lewat.');
    return;
  }
  if (reminders.some(r => r.name === matchName && r.time === isoTime)) { alert('Sudah diatur.'); return; }
  reminders.push({ time: isoTime, name: matchName });
  localStorage.setItem('my-reminders', JSON.stringify(reminders));
  if (btnEl) { btnEl.classList.add('active'); btnEl.textContent = '✅ Diingatkan'; }
  renderReminderList();
}

function removeReminder(index) {
  reminders.splice(index, 1);
  localStorage.setItem('my-reminders', JSON.stringify(reminders));
  renderReminderList();
  loadContent(currentKey);
}

function renderReminderList() {
  const list = document.getElementById('reminder-list');
  if (reminders.length === 0) { list.innerHTML = '<li style="color:#888;">Belum ada pengingat.</li>'; return; }
  reminders.sort((a, b) => new Date(a.time) - new Date(b.time));
  list.innerHTML = reminders.map((r, i) => {
    const d = new Date(r.time);
    const timeStr = d.toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    return `<li><span><strong>${r.name}</strong> — ${timeStr}</span><button class="delete-reminder" onclick="removeReminder(${i})">Hapus</button></li>`;
  }).join('');
}

/* =====================================================
   8. PEMERIKSA PENGINGAT (Setiap 15 Detik, Jendela 2 Menit)
   ===================================================== */
setInterval(() => {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = Date.now();
  let changed = false;
  for (let i = reminders.length - 1; i >= 0; i--) {
    const r = reminders[i];
    const matchTime = new Date(r.time).getTime();
    const diff = matchTime - now;
    if (diff < -3600000) { reminders.splice(i, 1); changed = true; continue; }
    if (diff > 0 && diff <= 120000 && !r.notified) {
      try {
        new Notification('⏰ Segera Dimulai!', { body: `${r.name} mulai kurang dari 2 menit.`, icon: 'https://a.espncdn.com/favicon.ico', tag: r.time + r.name });
        r.notified = true; changed = true;
      } catch (e) { console.error(e); }
    }
  }
  if (changed) { localStorage.setItem('my-reminders', JSON.stringify(reminders)); renderReminderList(); }
}, 15000);

/* =====================================================
   9. AUTO-REFRESH JADWAL
   ===================================================== */
// Refresh setiap 30 menit (hanya jika tab terlihat)
setInterval(() => {
  if (document.visibilityState === 'visible') {
    console.log('[Auto-refresh] Memuat ulang jadwal...');
    loadContent(currentKey);
  }
}, 30 * 60 * 1000);

// Refresh saat tab kembali aktif
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    console.log('[Visibility] Tab kembali aktif, refresh jadwal...');
    loadContent(currentKey);
  }
});

/* =====================================================
   10. INISIALISASI
   ===================================================== */
renderTabs();
renderReminderList();
loadContent('nba');

// Registrasi Service Worker untuk PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
  });
}
</script>
</body>
</html>
